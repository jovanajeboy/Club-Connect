
events {}

http {
    upstream clubconnect_backends {
    least_conn;
    server backend1:5000 max_fails=1 fail_timeout=5s;
    server backend2:5000 max_fails=1 fail_timeout=5s;
    server backend3:5000 max_fails=1 fail_timeout=5s;
}

    server {
        listen 80;

        location / {
            proxy_next_upstream error timeout http_502 http_503 http_504;
proxy_next_upstream_tries 3;
            add_header X-Backend-Server $upstream_addr always;
add_header X-Load-Balancer nginx always;
            proxy_pass http://clubconnect_backends;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 2s;
            proxy_read_timeout 30s;
        }
    }
}
